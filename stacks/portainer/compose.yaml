# Portainer garde l'accès complet à Docker (c'est son rôle) ; il n'est joignable que via nginx.
name: portainer
services:
  portainer:
    image: portainer/portainer-ce:2.45.3
    container_name: portainer
    restart: unless-stopped
    command: --admin-password-file /run/secrets/portainer_admin
    ports: ["127.0.0.1:8006:9000"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    secrets: [portainer_admin]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/homelab/portainer:/data

secrets:
  portainer_admin: { file: /etc/homelab/secrets/portainer_admin }
