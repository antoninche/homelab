# En-têtes pour les applications qui ne les posent pas elles-mêmes
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# intégration possible entre les services du homelab (panneaux HA, etc.), refusée à tout autre site
add_header Content-Security-Policy "frame-ancestors 'self' https://*.exemple.duckdns.org" always;
add_header Permissions-Policy "interest-cohort=()" always;
