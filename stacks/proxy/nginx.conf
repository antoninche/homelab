user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 100m;
    http2 on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS : profil « intermediate » de Mozilla
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # HTTP : sonde de santé locale, sinon redirection vers HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        location = /healthz { access_log off; allow 127.0.0.1; deny all; return 200 "ok\n"; }
        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS sur un nom inconnu ou une adresse IP : poignée de main refusée
    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    include /etc/nginx/conf.d/*.conf;
}
