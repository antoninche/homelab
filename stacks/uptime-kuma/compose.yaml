name: uptime-kuma
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2-slim
    container_name: uptime-kuma
    restart: unless-stopped
    ports: ["127.0.0.1:8005:3001"]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    environment:
      TZ: ${TZ}
      UPTIME_KUMA_DB_TYPE: sqlite
    volumes: [/srv/homelab/uptime-kuma:/app/data]
    # socket-proxy : état des conteneurs internes (lecture seule)
    networks: [default, socket-proxy]

networks:
  socket-proxy: { external: true }
