; Modèles de l'IA locale (ia.), au choix dans le menu de l'interface. Un seul est en mémoire à la fois
; (--models-max 1) et aucun n'est chargé au réveil : le modèle choisi se charge au premier message (≈ 30 s),
; en changer décharge le précédent.
; Fichiers dans /srv/homelab/ia/modeles (« sudo homelab-survie telecharger » les retélécharge).
version = 1

; réglages communs
[*]
ctx-size = 16384
threads = 4
parallel = 1
jinja = true

; le plus malin, ≈ 2,7 mots/s sur le Pi ; « réflexion » coupée (elle ferait attendre plusieurs minutes)
[Général (Qwen3.5 4B)]
model = /modeles/qwen3.5-4b-non-censure-q4_k_m.gguf
chat-template-kwargs = {"enable_thinking": false}
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0

; deux fois plus rapide, moins malin
[Rapide (Qwen3.5 2B)]
model = /modeles/qwen3.5-2b-non-censure-q4_k_m.gguf
chat-template-kwargs = {"enable_thinking": false}
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0

; spécialisé dans le code (Qwen2.5-Coder 3B Instruct, réglages conseillés par Qwen)
[Code (Qwen2.5 Coder 3B)]
model = /modeles/qwen2.5-coder-3b-instruct-q4_k_m.gguf
temp = 0.7
top-p = 0.8
top-k = 20
repeat-penalty = 1.05
