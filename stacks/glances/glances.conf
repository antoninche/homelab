[global]
refresh=2
check_update=false

[network]
hide=docker.*,veth.*,br-.*,lo,vnet.*,macvtap.*,virbr.*

[diskio]
hide=loop.*,ram.*,mmcblk.*,zram.*

[containers]
# aussi les conteneurs arrêtés : Stirling-PDF en veille apparaît dans la salle de contrôle
all=True
disable=False

# liste des processus coupée : la salle de contrôle est ouverte sur le réseau local, sans mot de passe
[processlist]
disable=True

[programlist]
disable=True
