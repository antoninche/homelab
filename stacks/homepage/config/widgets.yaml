- greeting:
    text_size: 2xl
    text: Bienvenue
- resources:
    label: Raspberry Pi
    cpu: true
    memory: true
    disk: /
    cputemp: true
    tempmin: 30
    tempmax: 85
    uptime: true
    units: metric
- search:
    provider: duckduckgo
    target: _blank
# météo : coordonnées à adapter (exemple : Paris)
- openmeteo:
    label: Paris
    latitude: 48.8566
    longitude: 2.3522
    timezone: Europe/Paris
    units: metric
    cache: 15
    format:
      maximumFractionDigits: 0
- datetime:
    locale: fr
    text_size: xl
    format:
      dateStyle: full
      timeStyle: short
