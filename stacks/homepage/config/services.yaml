    - Cartes:
        icon: mdi-map-search-outline
        href: https://cartes.@DOMAIN@
        description: France entière, recherche de lieux, sans Internet
        siteMonitor: https://cartes.@DOMAIN@
        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { cartes: taille }
              label: Carte
            - field: { cartes: lieux }
              label: Lieux
    - Site local:
        icon: mdi-web
        href: https://site.@DOMAIN@
        description: Page statique, servie même sans Internet
        siteMonitor: https://site.@DOMAIN@

- Administration:
    - Uptime Kuma:
        icon: uptime-kuma.svg
        href: https://status.@DOMAIN@
        description: Disponibilité
        server: pi
        container: uptime-kuma
        widget:
          type: uptimekuma
          url: https://status.@DOMAIN@
          slug: homelab
          fields: ["up", "down"]
    - Sauvegardes:
        icon: mdi-cloud-check-outline
        href: https://noc.@DOMAIN@
        description: Chaque nuit · image le dimanche · essai le 8
        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { sauvegardes: locale }
              label: Locale
            - field: { sauvegardes: onedrive }
              label: OneDrive
            - field: { sauvegardes: place }
              label: Place
            - field: { sauvegardes: essai }
              label: Essai
    - Tailscale:
        icon: si-tailscale-#e2e8f0
        href: https://login.tailscale.com/admin/machines
        description: Accès depuis l'extérieur (VPN)
        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { tailscale: etat }
              label: Pi
            - field: { tailscale: appareils }
              label: Appareils en ligne
            - field: { tailscale: ip }
              label: Adresse
    - Portainer:
        icon: portainer.svg
        href: https://portainer.@DOMAIN@
        description: Conteneurs
        server: pi
        container: portainer
        widget:
          type: portainer
          url: https://portainer.@DOMAIN@
          env: 1
          key: "{{HOMEPAGE_FILE_PORTAINER_KEY}}"
    - ntfy:
        icon: ntfy.svg
        href: https://ntfy.@DOMAIN@
        description: Notifications
        server: pi
        container: ntfy
        widget:
          type: customapi
          url: https://ntfy.@DOMAIN@/v1/stats
          refreshInterval: 60000
          mappings:
            - field: messages
              label: Messages publiés
              format: number
    - Dozzle:
        icon: dozzle.svg
        href: https://logs.@DOMAIN@
        description: Journaux
        siteMonitor: https://logs.@DOMAIN@
        server: pi
        container: dozzle
        showStats: true
    - Apache:
        icon: apache.svg
        href: https://web.@DOMAIN@
        description: Serveur web
        siteMonitor: https://web.@DOMAIN@
    - Documentation:
        icon: mdi-book-open-variant
        href: https://doc.@DOMAIN@
        description: Services, sauvegardes, alertes, dépannage
        siteMonitor: https://doc.@DOMAIN@
        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { doc: maj }
              label: Mise à jour
