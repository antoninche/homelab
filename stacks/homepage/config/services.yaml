          refreshInterval: 60000
          mappings:
            - field: { wiki: etat }
              label: État
            - field: { wiki: livres }
              label: Livres
            - field: { wiki: taille }
              label: Taille
    - IA locale:
        icon: mdi-robot-happy-outline
        href: https://ia.@DOMAIN@
        description: Général et rapide non censurés, code · chargée au premier message
        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { ia: etat }
              label: État
            - field: { ia: modeles }
              label: Modèles
            - field: { ia: taille }
