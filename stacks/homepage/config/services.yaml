        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { cloud: etat }
              label: État
            - field: { cloud: reveil }
              label: Réveil
            - field: { cloud: donnees }
              label: Fichiers
    - Stirling-PDF:
        icon: stirling-pdf.svg
        href: https://pdf.@DOMAIN@
        description: Outils PDF · en veille, démarre à la demande
        widget:
          type: customapi
          url: https://noc.@DOMAIN@/data/accueil.json
          refreshInterval: 60000
          mappings:
            - field: { pdf: etat }
              label: État
            - field: { pdf: reveil }
              label: Réveil
    - IT-Tools:
        icon: it-tools.svg
        href: https://outils.@DOMAIN@
        description: Boîte à outils
        siteMonitor: https://outils.@DOMAIN@
        server: pi
        container: it-tools
        showStats: true

