# Connexion par clé uniquement (clé « homelab » du Mac ; copie de la clé privée dans les identifiants).
# root est autorisé, par clé seulement. sudo reste sans mot de passe (choix assumé).
PermitRootLogin prohibit-password
AllowUsers admin root
PasswordAuthentication no
KbdInteractiveAuthentication no
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
AllowTcpForwarding no
ClientAliveInterval 300
ClientAliveCountMax 2
# ajouts de l'audit Lynis du 4 novembre 2026
Compression no
LogLevel VERBOSE
MaxSessions 2
TCPKeepAlive no
